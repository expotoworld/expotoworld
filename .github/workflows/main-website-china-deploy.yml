name: Main Website (China) - Build and Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'expotoworld_website/**'
      - '.github/workflows/main-website-china-deploy.yml'
  workflow_dispatch:

env:
  OSS_BUCKET: expotoworld-cn-website
  OSS_REGION: cn-shanghai
  OSS_ENDPOINT: oss-cn-shanghai.aliyuncs.com

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: expotoworld_website/package-lock.json

      - name: Install dependencies
        working-directory: expotoworld_website
        run: npm ci

      - name: Build React app (China version)
        working-directory: expotoworld_website
        env:
          CI: false
        run: npm run build:china

      - name: Install ossutil
        run: |
          curl -o ossutil.zip https://gosspublic.alicdn.com/ossutil/v2/2.2.0/ossutil-2.2.0-linux-amd64.zip
          unzip ossutil.zip
          chmod +x ossutil-2.2.0-linux-amd64/ossutil
          sudo mv ossutil-2.2.0-linux-amd64/ossutil /usr/local/bin/ossutil

      - name: Check if secrets are configured
        run: |
          if [ -z "${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}" ]; then
            echo "❌ Error: ALIBABA_CLOUD_ACCESS_KEY_ID secret is not configured!"
            echo "Please add this secret in GitHub repository settings:"
            echo "  Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          fi
          if [ -z "${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}" ]; then
            echo "❌ Error: ALIBABA_CLOUD_ACCESS_KEY_SECRET secret is not configured!"
            exit 1
          fi
          echo "✅ Secrets are configured"

      - name: Deploy to Alibaba Cloud OSS
        working-directory: expotoworld_website/dist/china
        run: |
          # Upload all files to OSS
          ossutil cp -r . oss://${{ env.OSS_BUCKET }}/ \
            --region ${{ env.OSS_REGION }} \
            --access-key-id "${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}" \
            --access-key-secret "${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}" \
            --force

      - name: Install Aliyun CLI
        run: |
          curl -o aliyun-cli.tgz https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz
          tar -xzf aliyun-cli.tgz
          sudo mv aliyun /usr/local/bin/aliyun
          aliyun version

      - name: Refresh CDN cache
        run: |
          # Configure aliyun CLI
          aliyun configure set \
            --profile default \
            --mode AK \
            --access-key-id "${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}" \
            --access-key-secret "${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}" \
            --region cn-shanghai
          
          # Refresh the entire site directory
          echo "🔄 Refreshing CDN cache for https://expotoworld.cn/..."
          REFRESH_RESULT=$(aliyun cdn RefreshObjectCaches --ObjectPath "https://expotoworld.cn/" --ObjectType Directory --Force true)
          echo "$REFRESH_RESULT"
          
          TASK_ID=$(echo "$REFRESH_RESULT" | grep -o '"RefreshTaskId": "[^"]*"' | cut -d'"' -f4)
          echo "📋 Refresh Task ID: $TASK_ID"
          
          # Wait for refresh to complete (max 60 seconds)
          for i in {1..12}; do
            sleep 5
            STATUS=$(aliyun cdn DescribeRefreshTaskById --TaskId "$TASK_ID" | grep -o '"Status": "[^"]*"' | cut -d'"' -f4)
            echo "   Status: $STATUS"
            if [ "$STATUS" = "Complete" ]; then
              echo "✅ CDN cache refresh completed!"
              break
            fi
          done

      - name: Deployment summary
        run: |
          echo "✅ Main Website (China) deployed successfully!"
          echo "🌐 Production URL: https://expotoworld.cn"
          echo "📦 OSS Bucket: ${{ env.OSS_BUCKET }}"
          echo "🌏 Region: ${{ env.OSS_REGION }}"
