name: Main Website (Global) - Build and Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'expotoworld_website/**'
      - '.github/workflows/main-website-deploy.yml'
  workflow_dispatch:
    inputs:
      region:
        description: 'Which version to build and deploy'
        required: true
        default: 'global'
        type: choice
        options:
          - global
          - china

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  S3_BUCKET: ${{ vars.S3_BUCKET_MAIN_WEBSITE }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DIST_MAIN_WEBSITE }}

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: expotoworld_website/package-lock.json

      - name: Install dependencies
        working-directory: expotoworld_website
        run: npm ci

      - name: Build React app (Global version)
        working-directory: expotoworld_website
        env:
          CI: false
        run: npm run build:global

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/GitHubActionsECRPush-expotoworld
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        working-directory: expotoworld_website/dist
        run: |
          # Upload all assets with long cache (immutable)
          aws s3 sync . s3://${{ env.S3_BUCKET }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "manifest.json" \
            --exclude "robots.txt"
          
          # Upload HTML files with no-cache to ensure updates are immediate
          aws s3 sync . s3://${{ env.S3_BUCKET }}/ \
            --cache-control "public, max-age=0, must-revalidate" \
            --exclude "*" \
            --include "*.html" \
            --include "manifest.json" \
            --include "robots.txt"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Deployment summary
        run: |
          echo "✅ Main Website (Global) deployed successfully!"
          echo "🌐 Production URL: https://expotoworld.com"
          echo "☁️  CloudFront Distribution: ${{ env.CLOUDFRONT_DISTRIBUTION_ID }}"
          echo "📦 S3 Bucket: ${{ env.S3_BUCKET }}"
