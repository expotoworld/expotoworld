# Cloudflare Worker Configuration
# This worker acts as an API gateway routing requests to backend microservices

name = "device-api-gateway"
main = "worker.js"
compatibility_date = "2024-01-01"

# Account configuration
account_id = "3ffb93116c8d5ab05b5d0f5482296954"

# Worker settings
workers_dev = false

# Route configuration
# This worker is deployed at device-api.expotoworld.com
routes = [
  { pattern = "device-api.expotoworld.com/*", zone_name = "expotoworld.com" }
]

# =============================================================================
# LOCAL DEVELOPMENT CONFIGURATION
# =============================================================================
# Run locally with: npx wrangler dev --port 8787 --local
# The worker automatically detects local mode and routes to localhost services.
#
# Backend service ports (local):
#   - Auth Service:    http://localhost:8081
#   - User Service:    http://localhost:8083
#   - Catalog Service: http://localhost:8080
#   - Order Service:   http://localhost:8082
#   - Ebook Service:   http://localhost:8084
#
# Flutter apps connect via: http://127.0.0.1:8787 (iOS) or http://10.0.2.2:8787 (Android)
# =============================================================================

# Production environment variables (AWS App Runner URLs)
[env.production]
[env.production.vars]
AUTH_SERVICE = "https://4qexmd5mk9.eu-central-1.awsapprunner.com"
USER_SERVICE = "https://yumaw38pdp.eu-central-1.awsapprunner.com"
CATALOG_SERVICE = "https://kykqma8nq4.eu-central-1.awsapprunner.com"
ORDER_SERVICE = "https://mttci22rgj.eu-central-1.awsapprunner.com"
EBOOK_SERVICE = "https://255isteuvd.eu-central-1.awsapprunner.com"
